name: JS Standards

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory for all steps
        type: string
        default: '.'
      mode:
        description: 'Pipeline mode: draft | development | production'
        type: string
        default: 'production'
      node-version:
        description: Node.js version to use
        type: string
        default: 'lts/*'

# Least privilege: these jobs only read the repository, so the token is held to
# that whatever the calling workflow grants.
permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate mode
        env:
          WORKFLOW_MODE: ${{ inputs.mode }}
        run: |
          case "$WORKFLOW_MODE" in
            draft|development|production) ;;
            *) echo "::error::Invalid mode '$WORKFLOW_MODE'. Must be draft, development, or production." && exit 1 ;;
          esac

  eslint:
    name: ESLint
    needs: validate-inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    continue-on-error: ${{ inputs.mode == 'draft' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # pnpm only exists after the corepack step below, so setup-node's
          # package-manager cache cannot run here (same as the enforcement
          # workflows).
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: |
          # Node 25+ no longer bundles corepack; install a pinned copy when absent.
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack@0.36.0
          fi
          corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --max-warnings 0

  typescript:
    name: TypeScript Type Check
    needs: validate-inputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    continue-on-error: ${{ inputs.mode == 'draft' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # pnpm only exists after the corepack step below, so setup-node's
          # package-manager cache cannot run here (same as the enforcement
          # workflows).
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: |
          # Node 25+ no longer bundles corepack; install a pinned copy when absent.
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack@0.36.0
          fi
          corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit
