# ============================================================
# release-self-test — proves semver-release.yml's ADR-053 config check
# passes the shipped template and fails each bad fixture, and that every
# uses: line in this repository follows the pin rule (our own workflows at
# @vX.Y.Z, third-party actions by full commit SHA with a version comment).
# ============================================================

name: Release workflow self-test (ADR-053)

permissions:
  contents: read

on:
  workflow_call:

jobs:
  self-test:
    name: Release config check and action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Extract the validate-config script from semver-release.yml
        shell: bash
        run: |
          set -euo pipefail
          pip3 install pyyaml --quiet
          python3 - <<'PY'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/semver-release.yml'))
          steps = wf['jobs']['release']['steps']
          script = next(s['run'] for s in steps if s.get('id') == 'validate-config')
          open('/tmp/validate-config.sh', 'w').write(script)
          PY
          test -s /tmp/validate-config.sh

      - name: PASS — shipped template conforms
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE=caller-templates/release-please-config.json \
          MANIFEST_FILE=caller-templates/.release-please-manifest.json \
            bash /tmp/validate-config.sh

      - name: PASS — this repository's own config conforms
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE=release-please-config.json \
          MANIFEST_FILE=.release-please-manifest.json \
            bash /tmp/validate-config.sh
          # The manifest was seeded once from the latest exact tag (ADR-053
          # consequences); from then on only release-please writes it.
          jq -e '.["."] | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .release-please-manifest.json >/dev/null \
            || { echo "SELF-TEST FAIL: .release-please-manifest.json must hold the root version"; exit 1; }

      - name: FAIL — every fixture under fixtures/release/fail-* is rejected
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for dir in fixtures/release/fail-*/; do
            count=$((count + 1))
            result=0
            CONFIG_FILE="${dir}release-please-config.json" \
            MANIFEST_FILE=caller-templates/.release-please-manifest.json \
              bash /tmp/validate-config.sh || result=$?
            if [ "$result" -eq 0 ]; then
              echo "SELF-TEST FAIL: ${dir} should have been rejected but passed"
              exit 1
            fi
            echo "OK: ${dir} rejected"
          done
          [ "$count" -gt 0 ] || { echo "SELF-TEST FAIL: no fail fixtures found"; exit 1; }

      - name: FAIL — missing config is rejected
        shell: bash
        run: |
          set -euo pipefail
          result=0
          CONFIG_FILE=does-not-exist.json \
          MANIFEST_FILE=caller-templates/.release-please-manifest.json \
            bash /tmp/validate-config.sh || result=$?
          [ "$result" -ne 0 ] || { echo "SELF-TEST FAIL: missing config passed"; exit 1; }
          echo "OK: missing config rejected"

      - name: FAIL — unsafe config paths are rejected
        shell: bash
        run: |
          set -euo pipefail
          for bad in '../release-please-config.json' $'x\n::warning::injected' 'x%0A.json' 'a:b.json'; do
            result=0
            CONFIG_FILE="$bad" MANIFEST_FILE=caller-templates/.release-please-manifest.json \
              bash /tmp/validate-config.sh >/dev/null || result=$?
            [ "$result" -ne 0 ] || { echo "SELF-TEST FAIL: unsafe path accepted"; exit 1; }
          done
          echo "OK: unsafe config paths rejected"

      # REUSABLE-WORKFLOWS.md "Pin an exact release tag" (owner instruction
      # 2026-11-28): our own workflows at a release version @vX.Y.Z (the
      # RELEASE_TAG / REVIEWER_TAG placeholder in caller templates) or by local
      # path; third-party actions by full commit SHA with a "# vX" version
      # comment, maintained by Dependabot only (ADR-053 decision 5).
      - name: Every uses line follows the pin rule (and the rule rejects bad pins)
        shell: bash
        env:
          PIN_PY: |
            import glob, os, re, sys
            root = sys.argv[1]
            OWN = re.compile(r"^Starisian-Technologies/(sparxstar-code-conformance|sparxstar-pr-review)/")
            USES = re.compile(r"^\s*(?:-\s*)?uses:\s*(\S+)(.*)$")
            bad = []
            files = sorted(glob.glob(f"{root}/.github/workflows/*.yml") + glob.glob(f"{root}/caller-templates/*.yml"))
            for path in files:
                template = "/caller-templates/" in path
                for no, line in enumerate(open(path, encoding="utf-8"), 1):
                    m = USES.match(line)
                    if not m:
                        continue
                    ref, rest = m.group(1).strip("'\""), m.group(2)
                    where = f"{os.path.relpath(path, root)}:{no}: {ref}"
                    if ref.startswith("./"):
                        continue
                    if "@" not in ref:
                        bad.append(f"{where}: no pin")
                        continue
                    pin = ref.rsplit("@", 1)[1]
                    if OWN.match(ref):
                        if re.fullmatch(r"v\d+\.\d+\.\d+", pin) or (template and pin in ("RELEASE_TAG", "REVIEWER_TAG")):
                            continue
                        bad.append(f"{where}: our own workflows pin a release version @vX.Y.Z")
                    elif not re.fullmatch(r"[0-9a-f]{40}", pin):
                        bad.append(f"{where}: third-party actions pin a full commit SHA")
                    elif not re.search(r"#\s*v\d+(\.\d+)*\b", rest):
                        bad.append(f"{where}: third-party pin lacks its version comment (# vX.Y.Z)")
            for item in bad:
                print("PIN: " + item)
            print(f"{len(bad)} pin violation(s) in {len(files)} file(s)")
            sys.exit(1 if bad else 0)
        run: |
          set -euo pipefail
          python3 -c "$PIN_PY" .

          # The rule itself, on a scratch repo of good and bad pins. Built with
          # printf so this file's own lines are not read as pins.
          t=$(mktemp -d); mkdir -p "$t/.github/workflows" "$t/caller-templates"
          k=uses
          sha=0000000000000000000000000000000000000000
          own=Starisian-Technologies/sparxstar-code-conformance/.github/workflows/x.yml
          printf 'jobs:\n  a: { %s: %s }\n  b: { %s: %s }\n' \
            "$k" "$own@RELEASE_TAG" \
            "$k" "Starisian-Technologies/sparxstar-pr-review/.github/workflows/r.yml@REVIEWER_TAG" \
            > "$t/caller-templates/good.yml"
          printf 'jobs:\n  a:\n    %s: %s\n  b:\n    steps:\n      - %s: %s\n      - %s: %s\n' \
            "$k" "$own@v1.2.3" "$k" "actions/checkout@$sha # v5.0.0" "$k" "./.github/actions/local" \
            > "$t/.github/workflows/good.yml"
          python3 -c "$PIN_PY" "$t"
          for bad in "$own@RELEASE_TAG" "$own@v1" "$own@main" "$own@$sha # v1.2.3" "actions/checkout@v5" "actions/checkout@$sha"; do
            printf 'jobs:\n  a:\n    steps:\n      - %s: %s\n' "$k" "$bad" > "$t/.github/workflows/bad.yml"
            result=0; python3 -c "$PIN_PY" "$t" >/dev/null || result=$?
            [ "$result" -eq 1 ] || { echo "SELF-TEST FAIL: pin rule accepted: $bad"; exit 1; }
            echo "OK: rejected $bad"
          done

      - name: Caller template pins no hand-written release version
        shell: bash
        run: |
          set -euo pipefail
          # The pin is a placeholder the adopter replaces by lookup (ADR-053 decision 3).
          grep -q 'semver-release.yml@RELEASE_TAG' caller-templates/release.yml \
            || { echo "SELF-TEST FAIL: caller-templates/release.yml must pin @RELEASE_TAG"; exit 1; }
          echo "OK: caller template pin is the lookup placeholder"

      - name: Caller templates hand-write no release of this repository
        shell: bash
        run: |
          set -euo pipefail
          # ADR-053 decision 3: templates carry the RELEASE_TAG lookup
          # placeholder, never a version number.
          hits=$(grep -nE 'sparxstar-code-conformance/\.github/workflows/[^@[:space:]]+@v[0-9]|contract_ref:[[:space:]]*v[0-9]' caller-templates/*.yml || true)
          if [ -n "$hits" ]; then
            echo "SELF-TEST FAIL: hand-written version in a caller template:"$'\n'"$hits"
            exit 1
          fi
          echo "OK: caller templates pin by lookup placeholder"
