# ============================================================
# Release — this repository's own caller of semver-release.yml (ADR-053)
#
# Replaces the retired manual release workflow. Nobody tags or writes a
# release by hand: release-please opens a release pull request from
# Conventional Commits; merging it creates the vX.Y.Z tag and the GitHub
# Release. Find the current version from the latest GitHub Release, the latest
# vX.Y.Z tag, or the top of CHANGELOG.md, never from a document.
#
# The reusable workflow is called by local path, so each release runs the
# semver-release.yml on the commit being released. Consumers pin a tag
# instead (caller-templates/release.yml).
#
# The floating `v1` alias is frozen at its last position. Nothing moves it
# any more (ADR-053: a released tag is never moved); consumers pin exact tags.
#
# Credentials: the contract-sync App opens release pull requests so CI runs on
# them, with no GITHUB_TOKEN fallback (ADR-054). This repo is public, so it reads
# the organisation-level CONTRACT_SYNC_CLIENT_ID variable and
# CONTRACT_SYNC_PRIVATE_KEY secret (cross-repo/cross-repo-access-and-installation.md).
# ============================================================

name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release run at a time; never cancel one that may be tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/semver-release.yml
    permissions:
      contents: read         # checkout; release-please writes with the App token
      packages: write        # declared by semver-release.yml's image job; a caller
                             # must grant it even though no image is built here
    with:
      image_name: ''         # this repository ships no container image
      app_client_id: ${{ vars.CONTRACT_SYNC_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}
