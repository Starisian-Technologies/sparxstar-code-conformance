# Reusable workflow: enforce ADR-017 (pnpm platform-wide) in any consuming repo.
#
# Backs rule IDs NODE-PKG-001..004 in CI-Enforcement-Matrix.md.
# Per the master catalog (docs/standards-catalog.md, Part III Layer 3), this is the
# template the rest of the per-domain reusable workflows follow: enforcement_mode-aware
# (advisory warns; required blocks), thin wrapper, six-line caller per repo.
#
# Caller example (.github/workflows/standards.yml in a consuming repo):
#
#   name: Standards
#   on: [pull_request, push]
#   jobs:
#     pnpm:
#       uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/pnpm-enforcement.yml@v1
#       with:
#         enforcement_mode: required   # gate | advisory

name: pnpm enforcement (ADR-017)

on:
  workflow_call:
    inputs:
      enforcement_mode:
        description: 'gate (fail-closed) | advisory (warn-only) | (empty = legacy mode fallback)'
        required: false
        type: string
        default: ''
      mode:
        description: 'DEPRECATED: use enforcement_mode.'
        # REMOVAL: 2027-01-01 — all callers must migrate to enforcement_mode before this date
        required: false
        type: string
        default: draft
    secrets:
      COMPOSER_RESOLVER_PRIVATE_KEY:
        # Optional: only repos declaring a private dependency source need it.
        # Marking it required made every caller fail closed when the secret was
        # unavailable -- notably on bot-triggered runs, which read a separate
        # secrets store -- before any check had run.
        required: false

jobs:
  enforce:
    name: ADR-017 conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Private-source detection. The resolver credential exists only to fetch
      # git-hosted dependencies. A package.json whose specs all resolve from the
      # public registry needs no credential, so the mint step below is skipped and
      # the job runs unauthenticated -- including on bot-triggered runs, which
      # cannot read Actions secrets at all.
      - name: Detect git-hosted dependencies
        id: private-deps
        shell: bash
        run: |
          set -euo pipefail
          needs=false
          if [ -f package.json ]; then
            if jq -e '
              [ (.dependencies // {}), (.devDependencies // {}),
                (.optionalDependencies // {}), (.peerDependencies // {}) ]
              | map(to_entries) | add // []
              | map(.value | select(type == "string"))
              | map(select(
                  startswith("git+") or startswith("git://")
                  or startswith("github:") or startswith("gitlab:")
                  or startswith("bitbucket:") or contains("github.com")
                  or test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(#.*)?$")
                ))
              | length > 0
            ' package.json >/dev/null 2>&1; then
              needs=true
            fi
          fi
          echo "needs_private=$needs" >> "$GITHUB_OUTPUT"
          if [ "$needs" = "true" ]; then
            echo "Git-hosted dependencies declared - resolver credential required."
          else
            echo "No git-hosted dependencies declared - proceeding without a resolver credential."
          fi

      # Mirrors the check-secrets idiom already used by full-quality-gate.yml. The
      # secrets context cannot be evaluated in a step `if:`, so it is mapped to an
      # env var and reduced to a string output first.
      - name: Detect resolver credential availability
        id: resolver-key
        env:
          KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail loudly rather than resolve silently against an incomplete tree: a repo
      # that genuinely declares private sources must not pass on a partial install.
      - name: Require resolver credential for private sources
        if: steps.private-deps.outputs.needs_private == 'true' && steps.resolver-key.outputs.has_key != 'true'
        shell: bash
        run: |
          echo "::error::This repository declares private git-hosted dependency sources but no resolver credential is available to this run. Supply COMPOSER_RESOLVER_PRIVATE_KEY to the caller, or remove the private source. Runs triggered by an automated dependency bot read a separate secrets store and never receive Actions secrets."
          exit 1

      - name: Mint read token (composer-resolver)
        if: steps.private-deps.outputs.needs_private == 'true' && steps.resolver-key.outputs.has_key == 'true'
        id: read-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.COMPOSER_RESOLVER_CLIENT_ID }}
          private-key: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
          owner: Starisian-Technologies

      - name: Configure Git auth for private dependencies
        if: steps.private-deps.outputs.needs_private == 'true' && steps.resolver-key.outputs.has_key == 'true' && steps.read-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Warn on deprecated 'mode' input
        if: inputs.enforcement_mode == ''
        shell: bash
        run: |
          echo "::warning::DEPRECATED: 'mode' input will be removed 2027-01-01 — migrate to 'enforcement_mode: gate | advisory' (STD-TOOLCHAIN-001 §3)"

      # Sanitize inputs through env vars (CodeQL: never interpolate workflow_call inputs directly into shell).
      - name: Determine block behavior
        id: mode
        env:
          INPUT_EM: ${{ inputs.enforcement_mode }}
          INPUT_LM: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          em="$INPUT_EM"
          lm="$INPUT_LM"
          block=""
          if [ "$em" = "gate" ]; then
            block=true
          elif [ "$em" = "advisory" ]; then
            block=false
          elif [ -z "$em" ]; then
            # REMOVAL: 2027-01-01 — legacy mode bridge; callers must migrate to enforcement_mode
            case "$lm" in
              draft)                    block=false ;;
              development|production)   block=true  ;;
              *)
                echo "::error::Unknown mode '$lm' — migrate to enforcement_mode: gate | advisory (STD-TOOLCHAIN-001 §3)"
                exit 1 ;;
            esac
          else
            echo "::error::Unknown enforcement_mode '$em' — expected gate | advisory (STD-TOOLCHAIN-001 §3)"
            exit 1
          fi
          echo "BLOCK_MODE=$block" >> "$GITHUB_ENV"

      - name: NODE-PKG-002 — no foreign lockfiles
        shell: bash
        run: |
          set -euo pipefail
          forbidden=()
          for f in package-lock.json yarn.lock npm-shrinkwrap.json; do
            if [ -f "$f" ]; then forbidden+=("$f"); fi
          done
          if [ ${#forbidden[@]} -gt 0 ]; then
            msg="ADR-017 (NODE-PKG-002): forbidden lockfile(s) present: ${forbidden[*]}"
            if [ "$BLOCK_MODE" = "true" ]; then
              echo "::error::$msg"
              exit 1
            else
              echo "::warning::$msg"
            fi
          fi

      - name: NODE-PKG-003 — packageManager field is pinned pnpm
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          pm=$(node -e "try { const p = require('./package.json'); process.stdout.write(p.packageManager || '') } catch (e) { process.stdout.write('') }")
          if [[ "$pm" != pnpm@* ]]; then
            msg="ADR-017 (NODE-PKG-003): package.json missing pinned packageManager (expected 'pnpm@<version>', got '${pm:-<unset>}')"
            if [ "$BLOCK_MODE" = "true" ]; then
              echo "::error::$msg"
              exit 1
            else
              echo "::warning::$msg"
            fi
          fi

      - name: NODE-PKG-001 — workflows/scripts do not invoke npm or yarn install
        shell: bash
        run: |
          set -euo pipefail
          # ERE-safe boundary: command tokens must be followed by whitespace or end-of-line
          # (POSIX ERE does not implement \b — that would match a backspace byte).
          patterns='(^|[^[:alnum:]_-])(npm[[:space:]]+(install|i|ci)([[:space:]]|$)|yarn[[:space:]]+(install|add)([[:space:]]|$))'
          hits=$(grep -REn --include='*.yml' --include='*.yaml' --include='*.sh' \
              --include='Dockerfile*' --include='Makefile*' --include='package.json' --include='README*' --include='*.md' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=vendor --exclude-dir=dist --exclude-dir=build \
              -e "$patterns" . 2>/dev/null || true)
          if [ -n "$hits" ]; then
            msg=$'ADR-017 (NODE-PKG-001): non-pnpm package manager invocation found:\n'"$hits"
            if [ "$BLOCK_MODE" = "true" ]; then
              echo "::error::$msg"
              exit 1
            else
              echo "::warning::$msg"
            fi
          fi

      - name: NODE-PKG-004 — pnpm install --frozen-lockfile dry run
        if: hashFiles('package.json') != ''
        env:
          INPUT_EM: ${{ inputs.enforcement_mode }}
          INPUT_LM: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          em="$INPUT_EM"
          lm="$INPUT_LM"
          if [ -f pnpm-lock.yaml ]; then
            if [ "$em" = "gate" ] || { [ -z "$em" ] && { [ "$lm" = "development" ] || [ "$lm" = "production" ]; }; }; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          else
            msg="ADR-017 (NODE-PKG-004): package.json present but pnpm-lock.yaml missing — --frozen-lockfile requires it"
            if [ "$BLOCK_MODE" = "true" ]; then
              echo "::error::$msg"
              exit 1
            else
              echo "::warning::$msg"
              pnpm install --no-frozen-lockfile
            fi
          fi
