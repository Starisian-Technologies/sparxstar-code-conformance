# ============================================================
# stale-branches — delete this repository's stale branches with the
# contract-sync App (owner ruling 2026-11-25).
#
# Stale: the branch's work is merged into the default branch (no commits
# ahead of it, or its pull request was merged), or its last commit is 90 or
# more days old. Never touched: the default branch, `release-please--*`, and
# any branch with an open pull request.
#
# Manual only. `dry_run` (the default) lists what would be deleted. If a
# ruleset blocks a deletion, the branch is left and listed; the run does not
# work around the ruleset.
# ============================================================

name: Stale branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the stale branches without deleting them.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  delete:
    name: Delete stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint App token (this repository only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CONTRACT_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Find and delete stale branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -uo pipefail
          cutoff=$(date -u -d '90 days ago' +%s)
          open_heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u)
          {
            echo "### Stale branches"
            echo
            [ "$DRY_RUN" = true ] && echo "Dry run: nothing deleted." && echo
            echo "| Branch | Reason | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            [[ "$branch" == release-please--* ]] && continue
            grep -qxF -- "$branch" <<<"$open_heads" && continue
            enc=$(jq -rn --arg b "$branch" '$b|@uri')
            reason=""
            ahead=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$enc" --jq '.ahead_by' 2>/dev/null || echo "")
            if [ "$ahead" = 0 ]; then
              reason="no commits ahead of $DEFAULT_BRANCH"
            elif [ -n "$(gh api "repos/$REPO/pulls?state=closed&head=${REPO%%/*}:$enc&per_page=100" --jq '[.[] | select(.merged_at != null)] | .[0].number // empty')" ]; then
              reason="pull request merged"
            else
              last=$(gh api "repos/$REPO/commits/$enc" --jq '.commit.committer.date')
              if [ -n "$last" ] && [ "$(date -u -d "$last" +%s)" -le "$cutoff" ]; then
                reason="last commit $last (90+ days)"
              fi
            fi
            [ -z "$reason" ] && continue
            if [ "$DRY_RUN" = true ]; then
              result="would delete"
            elif out=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$enc" 2>&1); then
              result="deleted"
            else
              result="left: $(tr '\n|' '  ' <<<"$out" | cut -c1-160)"
              echo "::warning::$branch not deleted: $out"
            fi
            echo "$branch: $reason: $result"
            echo "| \`$branch\` | $reason | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
