name: CSS Standards

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory for all steps
        type: string
        default: '.'
      mode:
        description: 'Pipeline mode: draft | development | production'
        type: string
        default: 'production'
      node-version:
        description: Node.js version to use
        type: string
        default: 'lts/*'

# Least privilege: these jobs only read the repository, so the token is held to
# that whatever the calling workflow grants.
permissions:
  contents: read

jobs:
  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    continue-on-error: ${{ inputs.mode == 'draft' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate mode
        env:
          WORKFLOW_MODE: ${{ inputs.mode }}
        run: |
          case "$WORKFLOW_MODE" in
            draft|development|production) ;;
            *) echo "::error::Invalid mode '$WORKFLOW_MODE'. Must be draft, development, or production." && exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # pnpm only exists after the corepack step below, so setup-node's
          # package-manager cache cannot run here (same as the enforcement
          # workflows).
          package-manager-cache: false   # the pnpm store is cached explicitly below

      - name: Enable Corepack (pnpm)
        run: |
          # Node 25+ no longer bundles corepack; install a pinned copy when absent.
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack@0.36.0
          fi
          corepack enable

      - name: Use a cacheable pnpm store
        shell: bash
        run: echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stylelint
        run: pnpm exec stylelint "**/*.css" --max-warnings 0
