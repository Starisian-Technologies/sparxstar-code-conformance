# CodeQL advanced setup for this repository (CI cost rules: pull requests to
# main plus once a week, never on every push). Same shape as
# caller-templates/codeql.yml, but calls changed-paths.yml by local path.
#
# GitHub's CodeQL "default setup" must be switched off (Settings → Code
# security → Code scanning → CodeQL analysis → Switch to advanced): while it
# is on, results uploaded by this workflow are rejected.

name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'   # weekly

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml
    permissions:
      contents: read

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
