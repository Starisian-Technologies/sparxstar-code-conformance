# ============================================================
# credential-policy — which credentials a workflow may reference (ADR-056)
#
# Reusable workflow, run by every repository. It reads the caller's
# .github/workflows/*.yml, .github/actions/**/action.yml and a root
# action.yml, and fails on any credential outside the allowed set:
#
#   - allowed everywhere: GITHUB_TOKEN (secrets.GITHUB_TOKEN / github.token),
#     the composer-resolver App (read) and the contract-sync App (write) —
#     names from cross-repo/cross-repo-access-and-installation.md;
#   - never: a personal access token or any ad-hoc GitHub token name, a
#     GitHub token committed in a file, `secrets: inherit`, a dynamic
#     `secrets[...]` lookup, or a key held in a variable;
#   - AI provider keys: only in the central review repository (ADR-048,
#     ADR-056); everyone else requests reviews through its relay;
#   - COPILOT_MCP_* secrets: only in .github/workflows/copilot-setup-steps.yml,
#     the Copilot coding agent's own setup workflow (its MCP configuration lives
#     in repository settings); any other workflow uses the Apps;
#   - service deploy secrets (an npm publish token included): only those the
#     repository declares in
#     .github/credential-policy.yml:
#
#         deploy_secrets:
#           SECRET_NAME: which service it deploys to
#
# Secrets that a reusable workflow declares under on.workflow_call.secrets
# are parameters: their values are checked at the caller. Their names may
# still not be an AI key or a GitHub token.
#
# Each failure is an annotation on the file and line, naming the App to use
# instead.
#
# A second step checks the CI cost rules (REUSABLE-WORKFLOWS.md "CI cost
# rules"; owner instruction 2026-11-26) in the same job, so it costs no extra
# runner: push triggers only on main; workflow-level concurrency that cancels
# pull-request runs only and never a release; no path filters on the
# pull_request trigger (filter at the job level); security scans not on push;
# dependency installs cached; browser and database jobs gated on changed
# paths; and the shared Dependabot configuration. Caller: caller-templates/credential-policy.yml (or the
# `credentials` job in the standards-*.yml templates).
# ============================================================

name: Credential policy (ADR-056)

on:
  workflow_call:
    inputs:
      policy_file:
        description: Path of the repository's deploy-secret declaration.
        required: false
        type: string
        default: .github/credential-policy.yml
      cost_policy:
        description: >
          CI cost rules check (REUSABLE-WORKFLOWS.md "CI cost rules"):
          `gate` fails the job on a violation; `advisory` reports it as
          annotations only, for a repository working through its findings.
        required: false
        type: string
        default: gate

permissions:
  contents: read

jobs:
  credential-policy:
    name: Credential policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # credential-policy-self-test.yml runs CHECKER_PY against the fixtures in
      # fixtures/credential-policy/. Keep the step id and the env name.
      - name: Check workflow credentials
        id: check
        env:
          REPOSITORY: ${{ github.repository }}
          # The one repository allowed to hold AI provider keys (ADR-056
          # decision 3). Not an input, so a caller cannot widen it.
          AI_KEY_REPOSITORY: Starisian-Technologies/sparxstar-pr-review
          POLICY_FILE: ${{ inputs.policy_file }}
          CHECKER_PY: |
            import os, re, sys, glob
            try:
                import yaml
            except ImportError:
                yaml = None

            REPO = os.environ.get("REPOSITORY", "")
            AI_KEY_REPOSITORY = os.environ.get("AI_KEY_REPOSITORY", "")
            POLICY_FILE = os.environ.get("POLICY_FILE", ".github/credential-policy.yml")

            ALLOWED_SECRETS = {"GITHUB_TOKEN", "COMPOSER_RESOLVER_PRIVATE_KEY", "CONTRACT_SYNC_PRIVATE_KEY"}
            ALLOWED_CREDENTIAL_VARS = {"COMPOSER_RESOLVER_CLIENT_ID", "CONTRACT_SYNC_CLIENT_ID"}
            APP_NAMES = ALLOWED_SECRETS | ALLOWED_CREDENTIAL_VARS

            AI_RE = re.compile(r"ANTHROPIC|OPENAI|CHATGPT|CLAUDE|GEMINI|GOOGLE_AI|GENAI|VERTEX|MISTRAL|COHERE|GROQ|DEEPSEEK|PERPLEXITY|HUGGING|(^|_)HF(_|$)|(^|_)XAI(_|$)|BEDROCK|(^|_)LLM(_|$)|(^|_)AI_(API_)?KEY", re.I)
            PAT_RE = re.compile(r"(^|_)PAT(_|$)|PERSONAL_ACCESS|(^|_)GH_TOKEN$|GITHUB_TOKEN|(^|_)GH_(PAT|TOKEN)|_READ_TOKEN$|_WRITE_TOKEN$|_PUSH_TOKEN$|^REPO_TOKEN$|^BOT_TOKEN$", re.I)
            COPILOT_MCP_RE = re.compile(r"^COPILOT_MCP_", re.I)
            COPILOT_SETUP_WORKFLOW = ".github/workflows/copilot-setup-steps.yml"
            NPM_RE = re.compile(r"NPM_TOKEN|NPM_AUTH|NODE_AUTH_TOKEN|NPMJS", re.I)
            CRED_VAR_RE = re.compile(r"KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|PRIVATE", re.I)
            LITERAL_RE = re.compile(r"\b(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b")

            SECRET_REF = re.compile(r"(?<![\w.-])secrets\s*\.\s*([A-Za-z_][A-Za-z0-9_]*)|(?<![\w.-])secrets\s*\[\s*['\"]([A-Za-z_][A-Za-z0-9_]*)['\"]\s*\]")
            DYNAMIC_SECRET = re.compile(r"(?<![\w.-])secrets\s*\[\s*(?!['\"])")
            VAR_REF = re.compile(r"(?<![\w.-])vars\s*\.\s*([A-Za-z_][A-Za-z0-9_]*)|(?<![\w.-])vars\s*\[\s*['\"]([A-Za-z_][A-Za-z0-9_]*)['\"]\s*\]")
            INHERIT = re.compile(r"^\s*secrets\s*:\s*inherit\s*(#.*)?$")

            READ_APP = "composer-resolver App (vars.COMPOSER_RESOLVER_CLIENT_ID + secrets.COMPOSER_RESOLVER_PRIVATE_KEY) to read another repository or install private packages"
            WRITE_APP = "contract-sync App (vars.CONTRACT_SYNC_CLIENT_ID + secrets.CONTRACT_SYNC_PRIVATE_KEY) to write to another repository"
            DOC = "Mint block: sparxstar-code-conformance cross-repo/cross-repo-access-and-installation.md"

            def fix_github():
                return f"Use the {READ_APP}, or the {WRITE_APP}; the built-in GITHUB_TOKEN covers this repository. {DOC}."

            def fix_copilot_mcp():
                return ("COPILOT_MCP_* secrets belong to the Copilot coding agent's own MCP configuration (repository settings) and "
                        f"may appear only in {COPILOT_SETUP_WORKFLOW}. For cross-repository access in a workflow use the "
                        f"{READ_APP}, or the {WRITE_APP}. {DOC}.")

            def fix_npm():
                return ("If it publishes to npmjs.com, it is a deploy secret: declare it in "
                        f"{POLICY_FILE} under deploy_secrets. If it reads private organisation packages, use the built-in "
                        f"GITHUB_TOKEN (GitHub Packages, cross-repo access document Block E) or the {READ_APP}.")

            def fix_ai():
                return (f"AI provider keys live only in {AI_KEY_REPOSITORY or 'the central review repository'} (ADR-048). "
                        f"Request a review through the central review relay, which dispatches with the {WRITE_APP}. "
                        "Remove the key from this repository's workflows and secrets.")

            violations = []
            def report(path, line, name, rule, fix):
                violations.append((path, line, name, rule, fix))

            ai_allowed = bool(AI_KEY_REPOSITORY) and REPO.lower() == AI_KEY_REPOSITORY.lower()

            # --- per-repo deploy-secret declaration ---------------------------------
            declared = {}
            if os.path.exists(POLICY_FILE):
                if yaml is None:
                    print(f"::error::PyYAML is required to read {POLICY_FILE}"); sys.exit(2)
                try:
                    data = yaml.safe_load(open(POLICY_FILE, encoding="utf-8", errors="replace")) or {}
                except Exception as e:
                    report(POLICY_FILE, 1, "-", "invalid policy file", f"Not valid YAML: {e}")
                    data = {}
                ds = data.get("deploy_secrets", {}) if isinstance(data, dict) else None
                if not isinstance(ds, dict):
                    report(POLICY_FILE, 1, "deploy_secrets", "invalid policy file",
                           "deploy_secrets must be a mapping of SECRET_NAME: purpose (one line saying which service it deploys to).")
                    ds = {}
                for name, purpose in ds.items():
                    name = str(name)
                    if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name):
                        report(POLICY_FILE, 1, name, "invalid deploy secret name", "Use the exact secret name.")
                        continue
                    if not purpose or not str(purpose).strip():
                        report(POLICY_FILE, 1, name, "deploy secret without a purpose", "Say which service the secret deploys to.")
                        continue
                    if name.upper() in APP_NAMES:
                        report(POLICY_FILE, 1, name, "App credential declared as a deploy secret", "App credentials are always allowed; remove this entry.")
                        continue
                    if PAT_RE.search(name):
                        report(POLICY_FILE, 1, name, "GitHub token cannot be a deploy secret", fix_github()); continue
                    if COPILOT_MCP_RE.search(name):
                        report(POLICY_FILE, 1, name, "Copilot MCP secret cannot be a deploy secret", fix_copilot_mcp()); continue
                    if AI_RE.search(name) and not ai_allowed:
                        report(POLICY_FILE, 1, name, "AI provider key cannot be a deploy secret", fix_ai()); continue
                    declared[name.upper()] = str(purpose)

            # --- workflow files ------------------------------------------------------
            files = sorted(set(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
                               + glob.glob(".github/actions/**/action.yml", recursive=True)
                               + glob.glob(".github/actions/**/action.yaml", recursive=True)
                               + glob.glob("action.yml") + glob.glob("action.yaml")))

            def classify_secret(path, ln, name):
                u = name.upper()
                if u in ALLOWED_SECRETS:
                    return
                if COPILOT_MCP_RE.search(u):
                    if path != COPILOT_SETUP_WORKFLOW:
                        report(path, ln, name, "Copilot MCP secret outside the Copilot agent's setup workflow", fix_copilot_mcp())
                    return
                if AI_RE.search(u):
                    if not ai_allowed:
                        report(path, ln, name, "AI provider key outside the central review repository", fix_ai())
                    return
                if PAT_RE.search(u):
                    report(path, ln, name, "personal access token or ad-hoc GitHub token", fix_github()); return
                if u in declared:
                    return
                if NPM_RE.search(u):
                    report(path, ln, name, "npm token not declared", fix_npm()); return
                report(path, ln, name, "secret not in the allowed set",
                       f"For GitHub access use the {READ_APP}, or the {WRITE_APP}. "
                       f"If it is a service deploy secret, declare it in {POLICY_FILE} under deploy_secrets "
                       "(NAME: which service it deploys to).")

            for path in files:
                try:
                    text = open(path, encoding="utf-8", errors="replace").read()
                except OSError:
                    continue
                # Secrets declared by a reusable workflow are parameters: their values are
                # checked at the caller, so references to them are allowed here. Their
                # names still may not be an AI key or a GitHub token.
                params = set()
                if yaml is not None:
                    try:
                        doc = yaml.safe_load(text) or {}
                        on = doc.get("on", doc.get(True)) if isinstance(doc, dict) else None
                        wc = on.get("workflow_call") if isinstance(on, dict) else None
                        sec = wc.get("secrets") if isinstance(wc, dict) else None
                        if isinstance(sec, dict):
                            params = {str(k) for k in sec}
                    except Exception:
                        pass
                for p in params:
                    pu = p.upper()
                    if pu in ALLOWED_SECRETS:
                        continue
                    ln = next((i for i, l in enumerate(text.splitlines(), 1) if re.match(rf"\s*{re.escape(p)}\s*:", l)), 1)
                    if AI_RE.search(pu) and not ai_allowed:
                        report(path, ln, p, "reusable workflow accepts an AI provider key", fix_ai())
                    elif PAT_RE.search(pu):
                        report(path, ln, p, "reusable workflow accepts a GitHub token", fix_github())
                for ln, line in enumerate(text.splitlines(), 1):
                    stripped = line.lstrip()
                    if stripped.startswith("#"):
                        continue
                    if INHERIT.match(line):
                        report(path, ln, "inherit", "secrets: inherit",
                               "Pass only the named secrets the callee declares (cross-repo access document, 'Never').")
                    if LITERAL_RE.search(line):
                        report(path, ln, "(literal token)", "GitHub token committed in a workflow",
                               "Revoke it now, then " + fix_github()[0].lower() + fix_github()[1:])
                    if DYNAMIC_SECRET.search(line):
                        report(path, ln, "(dynamic lookup)", "dynamic secret lookup", "Reference each secret by its literal name so it can be checked.")
                    for m in SECRET_REF.finditer(line):
                        name = m.group(1) or m.group(2)
                        if name in params:
                            continue
                        classify_secret(path, ln, name)
                    for m in VAR_REF.finditer(line):
                        name = m.group(1) or m.group(2)
                        u = name.upper()
                        if u in ALLOWED_CREDENTIAL_VARS:
                            continue
                        if AI_RE.search(u) and CRED_VAR_RE.search(u):
                            report(path, ln, "vars." + name, "AI provider key in a variable", fix_ai())
                        elif CRED_VAR_RE.search(u) and not re.search(r"CLIENT_ID$|APP_ID$|_ID$|_URL$|_HOST$|_NAME$|_REGION$", u):
                            report(path, ln, "vars." + name, "credential in a variable",
                                   "Keys are Secrets, never Variables. " + fix_github())

            for path, ln, name, rule, fix in violations:
                msg = f"{name}: {rule}. {fix}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                prop = path.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
                print(f"::error file={prop},line={ln}::{msg}")
            summary = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary:
                with open(summary, "a") as fh:
                    fh.write("### Credential policy\n\n")
                    if violations:
                        fh.write("| File | Line | Reference | Rule |\n|---|---|---|---|\n")
                        for path, ln, name, rule, fix in violations:
                            fh.write(f"| `{path}` | {ln} | `{name}` | {rule} |\n")
                    else:
                        fh.write(f"No violations in {len(files)} workflow file(s).\n")
            print(f"{len(violations)} violation(s) in {len(files)} file(s)")
            sys.exit(1 if violations else 0)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$POLICY_FILE" =~ ^[A-Za-z0-9._/-]+$ || "$POLICY_FILE" == *..* ]]; then
            echo "::error::policy_file must be a plain relative path (letters, digits, . _ - /; no ..)."
            exit 1
          fi
          python3 -c 'import yaml' 2>/dev/null || pip3 install pyyaml --quiet
          python3 -c "$CHECKER_PY"

      # credential-policy-self-test.yml runs COST_PY against the fixtures in
      # fixtures/cost-policy/. Keep the step id and the env name.
      - name: Check CI cost rules
        id: cost
        if: ${{ !cancelled() }}
        env:
          COST_POLICY: ${{ inputs.cost_policy }}
          COST_PY: |
            import glob, os, re, sys
            import yaml

            DOC = "REUSABLE-WORKFLOWS.md \"CI cost rules\" in sparxstar-code-conformance"
            INSTALL_RE = re.compile(r"\b(pnpm (install|i)\b|npm ci\b|npm install\b(?!\s+(-g|--global))|yarn( install)?\s*$|composer install\b)", re.M)
            BROWSER_RE = re.compile(r"\bplaywright\b", re.I)
            SCAN_USES = ("github/codeql-action/", "ossf/scorecard-action")
            RELEASE_RE = re.compile(r"release|deploy|publish", re.I)

            violations = []
            def report(path, rule, msg):
                violations.append((path, rule, msg))

            def triggers(doc):
                on = doc.get("on", doc.get(True))
                if isinstance(on, str):
                    return {on: None}
                if isinstance(on, list):
                    return {k: None for k in on}
                return on if isinstance(on, dict) else {}

            def as_list(v):
                if v is None:
                    return []
                return v if isinstance(v, list) else [v]

            files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
            for path in files:
                try:
                    doc = yaml.safe_load(open(path, encoding="utf-8", errors="replace")) or {}
                except yaml.YAMLError as e:
                    report(path, "parse", f"not valid YAML: {e}"); continue
                if not isinstance(doc, dict):
                    continue
                on = triggers(doc)
                events = set(on)
                reusable_only = events <= {"workflow_call", "workflow_dispatch"}
                jobs = doc.get("jobs") or {}
                name = f"{doc.get('name', '')} {os.path.basename(path)}"
                steps_all = [s for j in jobs.values() if isinstance(j, dict) for s in (j.get("steps") or []) if isinstance(s, dict)]
                is_scan = any(str(s.get("uses", "")).startswith(SCAN_USES) for s in steps_all)

                # COST-001: push only to main, never tags.
                if "push" in events:
                    push = on.get("push") or {}
                    branches = as_list(push.get("branches")) if isinstance(push, dict) else []
                    if isinstance(push, dict) and (push.get("tags") or push.get("tags-ignore")):
                        report(path, "COST-001", "push on tags. CI runs only on pull requests and pushes to main; publish from the release workflow or the `release` event instead")
                    elif branches != ["main"] or (isinstance(push, dict) and push.get("branches-ignore")):
                        report(path, "COST-001", f"push must be limited to `branches: [main]` (found {branches or 'every branch'}). CI runs only on pull requests and pushes to main")

                # COST-004: security scans on pull requests plus a weekly schedule, never on push.
                if is_scan and "push" in events:
                    report(path, "COST-004", "security scan runs on push. Run it on pull requests to main plus a weekly `schedule`, not on every push")

                if not reusable_only:
                    # COST-002: concurrency on every workflow; cancel for pull requests only.
                    conc = doc.get("concurrency")
                    if conc is None:
                        report(path, "COST-002", "no workflow-level `concurrency`. Add one: group `${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}`, cancel-in-progress `${{ github.event_name == 'pull_request' }}` (literal false for release/deploy)")
                    else:
                        cancel = conc.get("cancel-in-progress", False) if isinstance(conc, dict) else False
                        # A quoted 'true'/'false' is read by Actions as the boolean.
                        if isinstance(cancel, str) and cancel.strip().lower() in ("true", "false"):
                            cancel = cancel.strip().lower() == "true"
                        releasey = bool(RELEASE_RE.search(name))
                        if releasey and cancel is not False:
                            report(path, "COST-002", "release/deploy workflow must never cancel a run: `cancel-in-progress: false`")
                        elif cancel is True and "push" in events:
                            report(path, "COST-002", "`cancel-in-progress: true` also cancels runs on main. Use `${{ github.event_name == 'pull_request' }}`")
                        elif isinstance(cancel, str) and "pull_request" not in cancel:
                            report(path, "COST-002", "cancel-in-progress must cancel pull-request runs only, e.g. `${{ github.event_name == 'pull_request' }}`")

                    # COST-003: path filters at the job level, not on the pull_request trigger.
                    pr = on.get("pull_request")
                    if isinstance(pr, dict) and (pr.get("paths") or pr.get("paths-ignore")):
                        report(path, "COST-003", "path filter on the pull_request trigger. Filter at the job level (changed-paths.yml + `if:`), so required checks still report and PRs never wait on a check that never runs")

                for jn, job in jobs.items():
                    if not isinstance(job, dict) or "uses" in job:
                        continue
                    steps = [s for s in (job.get("steps") or []) if isinstance(s, dict)]
                    runs = "\n".join(str(s.get("run", "")) for s in steps)
                    # COST-005: cache dependencies.
                    if INSTALL_RE.search(runs):
                        cached = any(str(s.get("uses", "")).startswith("actions/cache") for s in steps) or any(
                            str(s.get("uses", "")).startswith(("actions/setup-node", "actions/setup-python", "actions/setup-java", "actions/setup-go"))
                            and (s.get("with") or {}).get("cache") for s in steps)
                        if not cached:
                            report(path, "COST-005", f"job `{jn}` installs dependencies without a cache. Add actions/cache (keyed on the lockfile) or the setup action's `cache:` input")
                    # COST-006: browser and database tests only when the code they cover changes.
                    uses_browser = BROWSER_RE.search(runs) or any("playwright" in str(s.get("uses", "")) for s in steps)
                    if (uses_browser or job.get("services")) and not reusable_only:
                        cond = str(job.get("if", ""))
                        if "needs." not in cond:
                            kind = "browser (Playwright)" if uses_browser else "database (services)"
                            report(path, "COST-006", f"job `{jn}` runs {kind} tests on every change. Gate it on the code it covers: `needs: changes` and `if:` on a changed-paths.yml filter")

            # DEP-001: the shared Dependabot configuration.
            dep = next((p for p in (".github/dependabot.yml", ".github/dependabot.yaml") if os.path.exists(p)), None)
            if not dep:
                report(".github/dependabot.yml", "DEP-001", "missing. Copy caller-templates/dependabot.yml from sparxstar-code-conformance and keep the ecosystems this repository uses")
            else:
                try:
                    cfg = yaml.safe_load(open(dep)) or {}
                except yaml.YAMLError as e:
                    cfg = {}; report(dep, "DEP-001", f"not valid YAML: {e}")
                for u in cfg.get("updates") or []:
                    eco = u.get("package-ecosystem", "?")
                    if (u.get("schedule") or {}).get("interval") != "weekly":
                        report(dep, "DEP-001", f"{eco}: schedule.interval must be weekly")
                    groups = list((u.get("groups") or {}).values())
                    ver = [g for g in groups if g.get("applies-to", "version-updates") == "version-updates"]
                    sec = [g for g in groups if g.get("applies-to") == "security-updates"]
                    if not any(g.get("patterns") == ["*"] and not g.get("update-types") and not g.get("exclude-patterns") for g in ver):
                        report(dep, "DEP-001", f"{eco}: group every version update into one pull request (applies-to: version-updates, patterns: [\"*\"], no update-types)")
                    if not any(g.get("patterns") == ["*"] for g in sec):
                        report(dep, "DEP-001", f"{eco}: group security updates into one pull request (applies-to: security-updates, patterns: [\"*\"])")

            for path, rule, msg in violations:
                prop = path.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                text = f"{rule}: {msg}. See {DOC}.".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                print(f"::error file={prop}::{text}")
            summary = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary:
                with open(summary, "a") as fh:
                    fh.write("### CI cost policy\n\n")
                    if violations:
                        fh.write("| File | Rule | Finding |\n|---|---|---|\n")
                        for path, rule, msg in violations:
                            fh.write(f"| `{path}` | {rule} | {msg.replace('|', '/')} |\n")
                    else:
                        fh.write(f"No violations in {len(files)} workflow file(s).\n")
            print(f"{len(violations)} CI cost violation(s) in {len(files)} workflow file(s)")
            sys.exit(1 if violations else 0)
        shell: bash
        run: |
          set -uo pipefail
          case "$COST_POLICY" in gate|advisory) ;; *) echo "::error::cost_policy must be gate or advisory"; exit 1 ;; esac
          python3 -c 'import yaml' 2>/dev/null || pip3 install pyyaml --quiet
          result=0
          python3 -c "$COST_PY" || result=$?
          if [ "$result" -ne 0 ] && [ "$COST_POLICY" = advisory ]; then
            echo "::warning::CI cost rules: violations reported as advisory (cost_policy: advisory)"
            exit 0
          fi
          exit "$result"
