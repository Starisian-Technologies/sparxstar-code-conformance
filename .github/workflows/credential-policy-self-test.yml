# ============================================================
# credential-policy-self-test — proves credential-policy.yml's checker
# passes every fixtures/credential-policy/pass-* and fails every fail-*
# with a message naming the fix, and runs the real reusable workflow on
# this repository (ADR-056).
# ============================================================

name: Credential policy self-test (ADR-056)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/credential-policy.yml'
      - 'fixtures/credential-policy/**'
      - 'caller-templates/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/credential-policy.yml'
      - 'fixtures/credential-policy/**'
      - 'caller-templates/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Credential policy fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Extract the checker from credential-policy.yml
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip3 install pyyaml --quiet
          python3 - <<'PY'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/credential-policy.yml'))
          step = next(s for s in wf['jobs']['credential-policy']['steps'] if s.get('id') == 'check')
          open('/tmp/checker.py', 'w').write(step['env']['CHECKER_PY'])
          print('AI_KEY_REPOSITORY=' + step['env']['AI_KEY_REPOSITORY'])
          PY
          test -s /tmp/checker.py

      - name: Every pass-* fixture passes; every fail-* fails with its fix
        shell: bash
        run: |
          set -euo pipefail
          ai_repo=$(python3 -c "import yaml; wf=yaml.safe_load(open('.github/workflows/credential-policy.yml')); print(next(s for s in wf['jobs']['credential-policy']['steps'] if s.get('id')=='check')['env']['AI_KEY_REPOSITORY'])")
          count=0
          for dir in fixtures/credential-policy/*/; do
            count=$((count + 1)); name=$(basename "$dir")
            repo="Starisian-Technologies/fixture"
            [ -f "${dir}.repository" ] && repo=$(cat "${dir}.repository")
            result=0
            out=$(cd "$dir" && REPOSITORY="$repo" AI_KEY_REPOSITORY="$ai_repo" python3 /tmp/checker.py) || result=$?
            case "$name" in
              pass-*)
                [ "$result" -eq 0 ] || { echo "SELF-TEST FAIL: $name should pass:"; echo "$out"; exit 1; } ;;
              fail-*)
                [ "$result" -eq 1 ] || { echo "SELF-TEST FAIL: $name should fail (exit $result):"; echo "$out"; exit 1; }
                expect=$(cat "${dir}.expect")
                grep -qF -- "$expect" <<<"$out" \
                  || { echo "SELF-TEST FAIL: $name message lacks '$expect':"; echo "$out"; exit 1; } ;;
              *) echo "SELF-TEST FAIL: fixture $name must start with pass- or fail-"; exit 1 ;;
            esac
            echo "OK: $name"
          done
          [ "$count" -gt 0 ] || { echo "SELF-TEST FAIL: no fixtures"; exit 1; }

      # Built at run time so no token-shaped string is ever committed.
      - name: A GitHub token committed in a workflow fails without echoing it
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); mkdir -p "$tmp/.github/workflows"
          fake="ghp_$(printf 'A%.0s' $(seq 1 36))"
          printf 'on: push\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo %s\n' "$fake" > "$tmp/.github/workflows/ci.yml"
          result=0
          out=$(cd "$tmp" && REPOSITORY=Starisian-Technologies/fixture python3 /tmp/checker.py) || result=$?
          [ "$result" -eq 1 ] || { echo "SELF-TEST FAIL: committed token passed"; exit 1; }
          grep -qF 'Revoke it now' <<<"$out" || { echo "SELF-TEST FAIL: no revoke instruction"; exit 1; }
          if grep -qF "$fake" <<<"$out"; then echo "SELF-TEST FAIL: token echoed"; exit 1; fi
          echo "OK: committed token rejected and not echoed"

      - name: Every caller template passes the policy
        shell: bash
        run: |
          set -euo pipefail
          for tpl in caller-templates/*.yml; do
            [ "$(basename "$tpl")" = dependabot.yml ] && continue
            tmp=$(mktemp -d); mkdir -p "$tmp/.github/workflows"
            cp "$tpl" "$tmp/.github/workflows/"
            result=0
            out=$(cd "$tmp" && REPOSITORY=Starisian-Technologies/fixture python3 /tmp/checker.py) || result=$?
            [ "$result" -eq 0 ] || { echo "SELF-TEST FAIL: $tpl violates the credential policy:"; echo "$out"; exit 1; }
            echo "OK: $tpl"
          done

  # This repository runs the shared check on itself, like every caller.
  self:
    name: Credential policy (this repository)
    uses: ./.github/workflows/credential-policy.yml
    permissions:
      contents: read
