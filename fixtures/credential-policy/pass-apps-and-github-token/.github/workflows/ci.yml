name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
  build:
    needs: check-secrets
    if: needs.check-secrets.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.COMPOSER_RESOLVER_CLIENT_ID }}
          private-key: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
      - id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CONTRACT_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ github.token }}
          OTHER: ${{ secrets.GITHUB_TOKEN }}
          NODE_VERSION: ${{ vars.NODE_VERSION }}
        # secrets.SOMETHING_IN_A_COMMENT is ignored
        run: echo ok
