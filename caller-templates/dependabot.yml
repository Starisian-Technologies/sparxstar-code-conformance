# Drop this file into any repository at:
#   .github/dependabot.yml
#
# The one Dependabot configuration every repository adopts (ADR-058).
# How Dependabot pull requests are merged is a platform rule, not part of this
# file. It is in the governance snapshot (.github/instructions/governance/,
# "Dependabot updates"): merge without waiting for CI, fix a red default branch
# forward at once, never release or deploy from a red default branch. A
# repository that deploys automatically on merge merges them only on green CI.
#
# What this file sets, for each ecosystem:
#   - weekly version updates;
#   - minor and patch updates in ONE grouped pull request per ecosystem;
#   - security updates in ONE grouped pull request per ecosystem;
#   - major updates as separate pull requests, one per dependency (not
#     grouped, so each breaking change is reviewed on its own);
#   - a 3-day cooldown before a new version is proposed. Cooldown applies to
#     version updates only; security updates are never delayed by it.
#
# Keep only the ecosystems the repository uses: Dependabot reports an error
# for an entry whose directory has no manifest.
#   github-actions — workflows under .github/workflows and a root action.yml.
#                    This also bumps reusable-workflow pins such as
#                    sparxstar-code-conformance's, once RELEASE_TAG
#                    placeholders are replaced with real tags.
#   npm            — npm and pnpm projects (pnpm uses the npm ecosystem).
#   composer       — PHP projects.
# A manifest outside the repository root: change `directory`.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      composer-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
