# Drop this file into any repository at:
#   .github/dependabot.yml
#
# The one Dependabot configuration every repository adopts (owner instructions
# 2026-11-26 and 2026-11-27: CI cost rules; REUSABLE-WORKFLOWS.md "CI cost rules").
#
# What this file sets, for each ecosystem:
#   - weekly version updates;
#   - minor and patch updates in ONE grouped pull request per ecosystem;
#   - each major update as its own pull request (not grouped, so each breaking
#     change is reviewed on its own);
#   - security updates in ONE grouped pull request per ecosystem;
#   - at most 5 open version-update pull requests per ecosystem
#     (open-pull-requests-limit; security-update pull requests have GitHub's
#     own separate limit);
#   - a 3-day cooldown before a new version is proposed. Cooldown applies to
#     version updates only; security updates are never delayed by it.
#
# Dependabot pull requests run CI like any other pull request; merge them when
# CI is green.
#
# Keep only the ecosystems the repository uses: Dependabot reports an error
# for an entry whose directory has no manifest.
#   github-actions — workflows under .github/workflows and a root action.yml.
#                    This also bumps reusable-workflow pins such as
#                    sparxstar-code-conformance's, once RELEASE_TAG
#                    placeholders are replaced with real tags.
#   npm            — npm and pnpm projects (pnpm uses the npm ecosystem).
#   composer       — PHP projects.
# A manifest outside the repository root: change `directory`.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      composer-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
