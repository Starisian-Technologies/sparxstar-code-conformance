# Drop this file into any consuming repo at:
#   .github/workflows/release.yml
# and copy, to the repository root:
#   caller-templates/release-please-config.json   -> release-please-config.json
#   caller-templates/.release-please-manifest.json -> .release-please-manifest.json
#
# ADR-053: every repository releases through this one workflow. Commits on the
# default branch follow Conventional Commits; release-please keeps CHANGELOG.md
# and opens a release pull request; merging it creates the vX.Y.Z tag and the
# GitHub Release. Never tag, write a release, or edit a version by hand.
#
# Pin: replace RELEASE_TAG below with the latest release tag of
# sparxstar-code-conformance that contains .github/workflows/semver-release.yml.
# Look it up; do not copy a number from any document:
#   git ls-remote --tags --refs https://github.com/Starisian-Technologies/sparxstar-code-conformance \
#     | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1
# After that, caller-templates/dependabot.yml keeps the pin current by PR.
#
# Before 1.0.0: a breaking change bumps MINOR. Public go-live is a commit with
# the footer `Release-As: 1.0.0`, approved by the owner (ADR-053).
#
# Before the first run, check the repository's rulesets: a ruleset on all
# branches that blocks force pushes or requires code-scanning results must
# exclude `release-please--*`, or the first run fails updating the release
# branch (REUSABLE-WORKFLOWS.md "Releases (ADR-053)", step 6).
#
# A repository that already has vX.Y.Z tags: before the first run, set
# .release-please-manifest.json to {".": "<latest tag without the v>"}, read
# with `git describe --tags --abbrev=0`. From then on only release-please
# writes it.

name: Release

on:
  push:
    branches: [main]

# One release run at a time; never cancel one that may be tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/semver-release.yml@RELEASE_TAG
    permissions:
      contents: read         # checkout; release-please writes with the App token
      packages: write        # push the image to GHCR. Keep it even with no image:
                             # semver-release.yml's image job declares it, and a
                             # caller that grants less fails at startup.
    with:
      # Container image name under ghcr.io/<owner>/ (lowercase). Leave empty if
      # the repository ships no image.
      image_name: ''
      # image_context: .
      # dockerfile: Dockerfile

      # Required. The contract-sync GitHub App opens release pull requests, so
      # CI runs on them and the merge gate (ADR-037) can pass; there is no
      # GITHUB_TOKEN fallback (ADR-054). Names from
      # cross-repo/cross-repo-access-and-installation.md: a public repo reads
      # the organisation-level values; a private repo needs repository-level
      # copies. The App must be installed on this repository with Contents and
      # Pull requests write. Images go to ghcr.io (ADR-055).
      app_client_id: ${{ vars.CONTRACT_SYNC_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}
