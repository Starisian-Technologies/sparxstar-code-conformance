# Drop this file into any repository at:
#   .github/workflows/credential-policy.yml
# A repository that already copies a caller-templates/standards-*.yml template
# gets the same check as its `credentials` job and does not need this file.
#
# ADR-056: a workflow may reference only GITHUB_TOKEN, the composer-resolver
# App (read) and the contract-sync App (write), plus the service deploy secrets
# this repository declares. No personal access tokens. No AI provider keys
# outside the central review repository. The check fails on anything else and
# names the App to use instead.
#
# Deploy secrets: declare them in .github/credential-policy.yml, one line each,
# saying which service the secret deploys to. Omit the file if there are none.
#
#   deploy_secrets:
#     EXAMPLE_DEPLOY_TOKEN: which service it deploys to
#
# Pin: replace RELEASE_TAG with the latest release tag of
# sparxstar-code-conformance. Look it up; do not copy a number from any
# document (ADR-053 decision 3):
#   git ls-remote --tags --refs https://github.com/Starisian-Technologies/sparxstar-code-conformance \
#     | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1

name: Credential policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CI cost rules: one run per PR or ref; cancel superseded runs on pull
# requests only, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI cost rules: one small job (no checkout) decides whether this change is
  # docs-only. Every job below is gated on it at the JOB level, so a skipped
  # job still reports (skipped counts as passing) and a PR never waits on a
  # check that never runs. Add named `filters` for browser or database jobs,
  # and gate those on `fromJSON(needs.changes.outputs.matches).<name>`.
  changes:
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/changed-paths.yml@RELEASE_TAG
    permissions:
      contents: read

  credentials:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/credential-policy.yml@RELEASE_TAG
    permissions:
      contents: read
    # No secrets: the check reads workflow files only.
