# Drop this file into a standalone-react consuming repo at:
#   .github/workflows/standards.yml
#
# Pin: replace every RELEASE_TAG below (each `uses:` line and `contract_ref`)
# with the latest release tag of sparxstar-code-conformance. Look it up; do not
# copy a number from any document (ADR-053 decision 3):
#   git ls-remote --tags --refs https://github.com/Starisian-Technologies/sparxstar-code-conformance \
#     | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1
# Never @main, and never the frozen `v1` alias (REUSABLE-WORKFLOWS.md "Pin an exact
# release tag"). After that, caller-templates/dependabot.yml keeps the pin current by PR.
#
# enforcement_mode: start advisory (warn-only); flip to gate (fail-closed) only once
# violations are zero. See REUSABLE-WORKFLOWS.md "Advisory first, gate when clean."

name: Starisian Standards

on:
  pull_request:
  push:
    branches: [main]

# CI cost rules: one run per PR or ref; cancel superseded runs on pull
# requests only, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI cost rules: one small job (no checkout) decides whether this change is
  # docs-only. Every job below is gated on it at the JOB level, so a skipped
  # job still reports (skipped counts as passing) and a PR never waits on a
  # check that never runs. Add named `filters` for browser or database jobs,
  # and gate those on `fromJSON(needs.changes.outputs.matches).<name>`.
  changes:
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/changed-paths.yml@RELEASE_TAG
    permissions:
      contents: read

  pnpm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/pnpm-enforcement.yml@RELEASE_TAG
    with:
      enforcement_mode: advisory
    secrets:
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}

  react:
    # react-enforcement.yml runs pnpm install but currently declares no workflow_call secrets
    # and performs no git-auth setup. Repos with private GitHub-hosted JS dependencies will
    # hit a git-auth failure in this job even if the pnpm job above succeeds. This is a known
    # platform gap requiring a change to the reusable workflow itself. Do not pass
    # COMPOSER_RESOLVER_PRIVATE_KEY here unless the pinned tag's node-enforcement.yml
    # declares it under on.workflow_call.secrets; otherwise workflow validation rejects it. See the platform setup doc (docs/platform-setup/) §4.3
    # for details and check this repo's tags for a release that ships the fix.
    needs: [changes, pnpm]
    if: needs.changes.outputs.code == 'true'
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/react-enforcement.yml@RELEASE_TAG
    with:
      repo_type: standalone-react
      profile_version: v1
      enforcement_mode: advisory
      node-version: '22'
      bundle-size-limit-kb: 150

  css:
    needs: [changes, pnpm]
    if: needs.changes.outputs.code == 'true'
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/css-enforcement.yml@RELEASE_TAG
    with:
      repo_type: standalone-react
      profile_version: v1
      enforcement_mode: advisory
    secrets:
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}

  media:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/media-enforcement.yml@RELEASE_TAG
    with:
      repo_type: standalone-react
      enforcement_mode: advisory
      profile_version: v1

  version-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Warns (or hard-fails below the floor) if this file's pins fall behind the
    # recommended patch tag. contract_ref MUST match the tag pinned on the jobs above --
    # bump both together. Drift record ON (owner ruling, 2026-11-04): this repo's
    # version state is recorded in sparxstar-architecture-governance-registry (internal)
    # via contract-sync. Set CONTRACT_SYNC_CLIENT_ID (variable) and
    # CONTRACT_SYNC_PRIVATE_KEY (secret) first -- see
    # cross-repo/cross-repo-access-and-installation.md. The callee reads the client ID
    # as a variable itself, so only the secret is passed.
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/version-drift-enforcement.yml@RELEASE_TAG
    with:
      contract_ref: RELEASE_TAG
      write_drift_record: true
    secrets:
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
      CONTRACT_SYNC_PRIVATE_KEY: ${{ secrets.CONTRACT_SYNC_PRIVATE_KEY }}

  credentials:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ADR-056: fails on any credential other than GITHUB_TOKEN, the two Apps and
    # the deploy secrets declared in .github/credential-policy.yml, and names
    # the App to use instead. Also runs the platform security checks
    # (DATA-001, TLS-001, NEON-001; README.md). Reads files only; no secrets.
    uses: Starisian-Technologies/sparxstar-code-conformance/.github/workflows/credential-policy.yml@RELEASE_TAG
    permissions:
      contents: read
